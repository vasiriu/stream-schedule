<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配信スケジュール & アンケート</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .schedule-frame {
            width: 100%;
            max-width: 500px;
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
        }

        .frame-top { width: 100%; aspect-ratio: 1152 / 216; background-image: url('top.png'); background-size: 100% 100%; background-repeat: no-repeat; flex-shrink: 0; }
        .frame-middle { width: 100%; background-image: url('lr.png'); background-size: 100% auto; background-repeat: repeat-y; padding: 0px 50px; box-sizing: border-box; }
        .frame-bottom { width: 100%; aspect-ratio: 1152 / 43; background-image: url('foot.png'); background-size: 100% 100%; background-repeat: no-repeat; flex-shrink: 0; }

        .section-title { text-align: center; font-size: 18px; font-weight: bold; margin: 10px 0 20px 0; color: #a8a8ff; text-decoration: underline; }

        #schedule-container, #poll-container { display: flex; flex-direction: column; gap: 12px; }

        .schedule-card, .poll-card, .link-card {
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
            transition: all 0.1s;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: inherit;
        }

        .link-card {
            background: linear-gradient(135deg, rgba(168, 168, 255, 0.2), rgba(255, 255, 255, 0.1));
            border-left: 4px solid #a8a8ff;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .link-card:active { transform: scale(0.98); background-color: rgba(168, 168, 255, 0.3); }

        .title-text { 
            font-size: 15px; 
            font-weight: bold; 
            z-index: 1; 
            word-break: break-all; 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        
        .date-info { display: flex; flex-direction: column; }
        .date-text { font-size: 13px; color: #ddddff; margin-bottom: 4px; }
        .date-text span { font-size: 18px; font-weight: bold; color: #ffffff; margin-right: 8px; }
        .calendar-btn { background: none; text-decoration: none; font-size: 24px; transition: transform 0.2s; cursor: pointer; }
        .calendar-btn:hover { transform: scale(1.2); }

        .poll-card { cursor: pointer; position: relative; overflow: hidden; }
        .poll-card:active { transform: scale(0.98); }

        /* 配信者（自分が追加した項目）用の特別な枠線カラー */
        .poll-card.owner-item {
            border-left: 4px solid #ff8ec6; 
        }

        /* 自由入力エリアのスタイル */
        .custom-input-container {
            margin-top: 20px;
            display: flex;
            gap: 8px;
        }
        .custom-input-text {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #a8a8ff;
            background-color: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .custom-input-text::placeholder {
            color: #8888aa;
        }
        .custom-input-btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background-color: #a8a8ff;
            color: #1e1e2f;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        .custom-input-btn:active {
            background-color: #8888dd;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 10000;
            border: 1px solid #a8a8ff;
            white-space: normal;
            text-align: center;
            max-width: 80%;
        }

        .loading { text-align: center; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="schedule-frame">
        <div class="frame-top"></div>
        <div class="frame-middle">
            <div class="section-title">スケジュール</div>
            <div id="schedule-container"><div class="loading">読み込み中...</div></div>

            <a href="https://vasiriu.github.io/stream-schedule/cm.html" class="link-card">
                トモダチコレクションるいう島の住民登録お願い
            </a>

            <div class="section-title">やってほしいのは？</div>
            <div id="poll-container"><div class="loading">読み込み中...</div></div>
            
            <div class="custom-input-container">
                <input type="text" id="custom-poll-title" class="custom-input-text" placeholder="タイトル追加">
                <button type="button" class="custom-input-btn" onclick="voteCustom()">送信</button>
            </div>
        </div>
        <div class="frame-bottom"></div>
    </div>

    <div id="toast"></div>

    <script>
        // =================================================================
        // 【設定画面】URLの貼り換えはここで行ってください
        // =================================================================
        const csvUrlBase = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSo5E-0zPAMe2eVFP0PWcl8hOm1qgznuQV94_M1EnoqS0_N95TyIFTurUoaC3QWITUYUQWHXfSfqTTq/pub?output=csv';
        const pollCsvUrl = csvUrlBase + '&gid=504323171'; 
        
        const voteApiUrl = 'https://script.google.com/macros/s/AKfycbzaZpdChdq2JHnsLyNQhmkGbf7eEBDUGDmeTtSu1FaeYgppdhjligsAHrhb6zue0Wra/exec';
        
        // =================================================================
        
        // 制限回数の定義
        const MAX_VOTES = 1;       // 投票は1回まで
        const MAX_ADDITIONS = 10;  // 新規追加は10回まで

        const monthColors = {
            "1": "rgba(200, 230, 255, 0.2)", "2": "rgba(220, 200, 255, 0.2)", "3": "rgba(255, 200, 220, 0.2)",
            "4": "rgba(255, 220, 220, 0.2)", "5": "rgba(200, 255, 200, 0.2)", "6": "rgba(200, 220, 255, 0.2)",
            "7": "rgba(200, 255, 255, 0.2)", "8": "rgba(255, 230, 180, 0.2)", "9": "rgba(255, 200, 150, 0.2)",
            "10": "rgba(255, 180, 150, 0.2)","11": "rgba(220, 200, 180, 0.2)","12": "rgba(255, 255, 200, 0.2)"
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000); 
        }

        // スケジュール
        Papa.parse(csvUrlBase, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                const container = document.getElementById('schedule-container');
                const now = new Date();
                const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                const events = results.data.filter(row => {
                    const m = row['月'], d = row['日'];
                    if(!m || !d) return false;
                    return new Date(now.getFullYear(), m-1, d).getTime() >= todayStart;
                }).slice(0, 5);
                container.innerHTML = events.length ? '' : '<div class="loading">予定は順次追加されます</div>';
                events.forEach(row => {
                    const card = document.createElement('div');
                    card.className = 'schedule-card';
                    card.style.backgroundColor = monthColors[row['月']] || "rgba(0,0,0,0.4)";
                    const calLink = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(row['内容'])}&dates=${now.getFullYear()}${row['月'].padStart(2,'0')}${row['日'].padStart(2,'0')}T200000Z/210000Z`;
                    card.innerHTML = `
                        <div class="date-info">
                            <div class="date-text"><span>${row['月']}/${row['日']}</span> ${row['時間']}</div>
                            <div class="title-text">${row['内容']}</div>
                        </div>
                        <a href="${calLink}" class="calendar-btn" target="_blank">📅</a>
                    `;
                    container.appendChild(card);
                });
            }
        });

        // アンケート
        Papa.parse(pollCsvUrl, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(results) {
                const container = document.getElementById('poll-container');
                container.innerHTML = '';
                
                if (results.data.length <= 1) {
                    container.innerHTML = '<div class="loading">アンケートはありません</div>';
                    return;
                }
                
                const dataRows = results.data.slice(1);
                const totalVotes = dataRows.reduce((sum, row) => sum + parseInt(row[1] || 0), 0);
                
                dataRows.forEach(row => {
                    let title = row[0] ? row[0].trim() : '';  
                    const votes = parseInt(row[1] || 0);        
                    
                    if (!title) return;
                    
                    const rowText = row.join(',');
                    const isViewer = rowText.includes('視聴者');
                    
                    // ★【20文字制限ロジック】20文字を超えている場合は20文字でカットして「…」を付加
                    if (title.length > 20) {
                        title = title.substring(0, 20) + '…';
                    }
                    
                    const percent = totalVotes > 0 ? (votes / totalVotes) * 100 : 0;
                    const card = document.createElement('div');
                    
                    if (isViewer) {
                        card.className = 'poll-card';
                        card.style.background = `linear-gradient(to right, rgba(255, 255, 255, 0.3) ${percent}%, rgba(255, 255, 255, 0.1) ${percent}%)`;
                    } else {
                        card.className = 'poll-card owner-item';
                        card.style.background = `linear-gradient(to right, rgba(168, 168, 255, 0.4) ${percent}%, rgba(255, 142, 198, 0.15) ${percent}%)`;
                    }
                    
                    card.innerHTML = `<div class="title-text">${title}</div>`;
                    card.onclick = () => vote(row[0] ? row[0].trim() : title); // 投票時はオリジナルのフルタイトルを送信
                    container.appendChild(card);
                });
            }
        });

        // 投票制限チェック
        function checkVoteLimit() {
            const voteCount = parseInt(localStorage.getItem('stream_vote_count') || '0');
            if (voteCount >= MAX_VOTES) {
                showToast('投票は1回までだよ！');
                return false;
            }
            return true;
        }

        // 新規追加制限チェック
        function checkAddLimit() {
            const addCount = parseInt(localStorage.getItem('stream_add_count') || '0');
            if (addCount >= MAX_ADDITIONS) {
                showToast('いっぱい追加してくれてありがとう、また明日追加してね。');
                return false;
            }
            return true;
        }

        // 既存の選択肢カードをクリックした時の投票
        function vote(title) {
            if (!checkVoteLimit()) return;
            
            showToast('投票完了！');
            localStorage.setItem('stream_vote_count', parseInt(localStorage.getItem('stream_vote_count') || '0') + 1);
            
            fetch(`${voteApiUrl}?title=${encodeURIComponent(title)}`, { mode: 'no-cors' })
            .catch(() => { console.error('通信エラー'); });
        }

        // 自由入力フォームから送信した時の投票（新規タイトル追加）
        function voteCustom() {
            const inputElem = document.getElementById('custom-poll-title');
            const title = inputElem.value.trim();
            
            if (!title) {
                showToast('タイトルを入力してね！');
                return;
            }
            
            if (!checkAddLimit()) return;
            
            showToast('投票を追加しました！');
            localStorage.setItem('stream_add_count', parseInt(localStorage.getItem('stream_add_count') || '0') + 1);
            inputElem.value = ''; 
            
            fetch(`${voteApiUrl}?title=${encodeURIComponent(title)}`, { mode: 'no-cors' })
            .catch(() => { console.error('通信エラー'); });
        }
    </script>
</body>
</html>
